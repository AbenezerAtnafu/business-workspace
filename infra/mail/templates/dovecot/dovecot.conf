# Dovecot — rendered from infra/mail/templates (ADR-012). One file on purpose:
# no conf.d drift between the container image and a plain VM.
protocols = imap pop3 lmtp
listen = *
log_path = /dev/stderr
info_log_path = /dev/stdout
auth_verbose = yes
auth_mechanisms = plain login
# Plaintext auth only over TLS, from localhost, or from the internal network
# the platform API connects from (login_trusted_networks).
disable_plaintext_auth = yes
login_trusted_networks = ${INTERNAL_SUBMIT_NETWORKS}
auth_failure_delay = 2 secs

ssl = yes
ssl_cert = <${TLS_CERT_FILE}
ssl_key = <${TLS_KEY_FILE}
ssl_min_protocol = TLSv1.2

# Every mailbox's mail is owned by one unprivileged system user.
mail_uid = ${MAIL_UID}
mail_gid = ${MAIL_GID}
first_valid_uid = ${MAIL_UID}
last_valid_uid = ${MAIL_UID}
mail_location = maildir:~/Maildir
mail_plugins = $mail_plugins quota

# The four fixed folders of api-contract.md §8, created and subscribed for
# every mailbox, with SPECIAL-USE flags so mail clients map them correctly.
namespace inbox {
  inbox = yes
  separator = /
  mailbox Drafts {
    auto = subscribe
    special_use = \Drafts
  }
  mailbox Sent {
    auto = subscribe
    special_use = \Sent
  }
  mailbox Trash {
    auto = subscribe
    special_use = \Trash
  }
  mailbox Junk {
    auto = subscribe
    special_use = \Junk
  }
}

# --- Authentication ---------------------------------------------------------
# Logins: the user's own mailbox address + the platform password (argon2id,
# same hash the app writes; migration 015's mail.logins decides who may log in).
passdb {
  driver = sql
  args = /etc/dovecot/dovecot-sql.conf.ext
}
# The platform API reads any mailbox (personal or shared) as
# "<address>*<master user>" — only from the internal network (allow_nets in
# the master-users file). Mail clients can never use it.
auth_master_user_separator = *
passdb {
  driver = passwd-file
  master = yes
  args = /etc/dovecot/master-users
  # pass = no (default): the target only has to exist in the userdb, so
  # shared mailboxes (no password of their own) are reachable too.
}
userdb {
  driver = sql
  args = /etc/dovecot/dovecot-sql.conf.ext
}

service auth {
  # Postfix SASL (submission port) authenticates through this listener.
  inet_listener {
    port = ${DOVECOT_AUTH_PORT}
  }
}
service lmtp {
  inet_listener lmtp {
    port = ${DOVECOT_LMTP_PORT}
  }
}
service imap-login {
  inet_listener imap {
    port = 143
  }
  inet_listener imaps {
    port = 993
    ssl = yes
  }
}
service pop3-login {
  inet_listener pop3 {
    port = 110
  }
  inet_listener pop3s {
    port = 995
    ssl = yes
  }
}

# Postfix asks this at RCPT TO whether the recipient has room (main.cf).
service quota-status {
  executable = quota-status -p postfix
  inet_listener {
    port = ${DOVECOT_QUOTA_STATUS_PORT}
  }
  client_limit = 1
}

# --- Quota: tenant.mailboxes.quota_bytes, enforced on delivery and APPEND ---
plugin {
  quota = count:User quota
  quota_vsizes = yes
  quota_status_success = DUNNO
  quota_status_nouser = DUNNO
  quota_status_overquota = "552 5.2.2 Mailbox is full"
}
protocol imap {
  mail_plugins = $mail_plugins imap_quota
}
protocol lmtp {
  postmaster_address = postmaster@${MAIL_HOSTNAME}
  # Delivery looks the recipient up by full address (personal or shared).
  auth_username_format = %Lu
}
