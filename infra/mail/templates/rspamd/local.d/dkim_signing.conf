# Each organization signs with its OWN domain key (ADR-002), generated by the
# app when the domain verifies and exported here by
# backend/scripts/export-dkim-keys.mjs as <domain>.<selector>.key, with
# selectors.map listing "<domain> <selector>".
enabled = true;
sign_authenticated = true;
sign_local = true;
sign_inbound = false;
use_domain = "header";
use_esld = false;
allow_username_mismatch = true;
allow_hdrfrom_mismatch = false;
selector_map = "${DKIM_KEY_DIR}/selectors.map";
path = "${DKIM_KEY_DIR}/$domain.$selector.key";
